name: polyhunter-local

services:
  postgres:
    image: ${POLYHUNTER_POSTGRES_IMAGE:-polyhunter-postgres:local}
    pull_policy: never
    platform: linux/amd64
    container_name: polyhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polyhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-polyhunter_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: polyhunter-dev:local
    container_name: polyhunter-web
    init: true
    restart: unless-stopped
    command:
      - npm
      - run
      - dev
      - --workspace
      - '@polyhunter/web'
      - --
      - --webpack
      - --hostname
      - 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      POLYHUNTER_DOCKER_DEV: '1'
      DATABASE_URL: postgresql://${POSTGRES_USER:-polyhunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polyhunter_dev}
      # PH-M01-WO-003 server-only secret-vault keyring. Blank by default, so the
      # stack boots healthy with the vault UNAVAILABLE. No default key material
      # and no NEXT_PUBLIC_* equivalent is defined here.
      POLYHUNTER_SECRET_ACTIVE_KEY_VERSION: ${POLYHUNTER_SECRET_ACTIVE_KEY_VERSION:-}
      POLYHUNTER_SECRET_KEYRING_JSON: ${POLYHUNTER_SECRET_KEYRING_JSON:-}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - type: bind
        source: ./vitest.integration.config.ts
        target: /workspace/vitest.integration.config.ts
      - type: bind
        source: ./apps/web
        target: /workspace/apps/web
      - type: bind
        source: ./packages/contracts
        target: /workspace/packages/contracts
      - type: bind
        source: ./packages/domain
        target: /workspace/packages/domain
      - type: bind
        source: ./packages/testkit
        target: /workspace/packages/testkit
      - type: bind
        source: ./packages/db
        target: /workspace/packages/db
      - type: volume
        source: web_next
        target: /workspace/apps/web/.next
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: polyhunter-dev:local
    container_name: polyhunter-worker
    init: true
    restart: unless-stopped
    command:
      - ./node_modules/.bin/nodemon
      - --legacy-watch
      - --polling-interval
      - '1000'
      - --watch
      - apps/worker
      - --watch
      - packages
      - --ext
      - ts,json
      - --exec
      - node
      - apps/worker/src/index.ts
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-polyhunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polyhunter_dev}
    volumes:
      - type: bind
        source: ./apps/worker
        target: /workspace/apps/worker
      - type: bind
        source: ./packages/contracts
        target: /workspace/packages/contracts
      - type: bind
        source: ./packages/domain
        target: /workspace/packages/domain
      - type: bind
        source: ./packages/testkit
        target: /workspace/packages/testkit
      - type: bind
        source: ./packages/db
        target: /workspace/packages/db
      - type: bind
        source: ./packages/polymarket
        target: /workspace/packages/polymarket
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  web_next:
    name: polyhunter-local-web-next
  postgres_data:
    name: polyhunter-local-postgres17
